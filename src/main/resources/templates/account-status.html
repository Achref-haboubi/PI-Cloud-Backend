<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Account Status</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0ebe5;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #ede8e3;
    }

    .header {
      background: linear-gradient(135deg, #1e1a16, #c96a3f);
      padding: 20px 30px;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .body {
      padding: 35px;
      color: #3d3530;
      line-height: 1.7;
      font-size: 15px;
    }

    .status {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
    }

    .active {
      background: #e6f7ed;
      color: #1a7f37;
    }

    .banned {
      background: #fdecea;
      color: #b42318;
    }

    .cta {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      background: #c96a3f;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }

    .footer {
      background: #1e1a16;
      color: #d6ccc2;
      padding: 30px;
      text-align: center;
    }

    .footer-title {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .footer-text {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .social-icons a {
      margin: 0 8px;
      text-decoration: none;
      font-size: 18px;
    }

    .copyright {
      margin-top: 20px;
      font-size: 12px;
      color: #a89f98;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    PeakWell
  </div>

  <!-- BODY -->
  <div class="body">

    <p>
      Hello <strong th:text="${name}">User</strong>,
    </p>

    <p th:text="${message}">
      Your account status has been updated.
    </p>

    <!-- STATUS -->
    <div>
      Status:
      <span th:text="${status}"
            th:classappend="${status == 'ACTIVE'} ? 'status active' : 'status banned'">
        ACTIVE
      </span>
    </div>

    <!-- CTA ONLY IF ACTIVE -->
    <div th:if="${status == 'ACTIVE'}">
      <a th:href="http://localhost:4200/" class="cta">
        Go to Platform →
      </a>
    </div>

    <p style="margin-top: 30px;">
      Regards,<br>
      <strong>PeakWell Team</strong>
    </p>

  </div>

  <!-- FOOTER -->
  <div class="footer">

    <div class="footer-title">
      Nourish &amp; Bloom
    </div>

    <div class="footer-text">
      Helping you eat well and live fully —<br>
      with real food, real science, and real community since 2018.
    </div>

    <!-- SOCIAL ICONS -->
     <div style="margin-bottom:15px;">
    
    <a href="https://facebook.com" target="_blank" style="margin:0 6px;">
      <img src="https://res.cloudinary.com/dbmb50bso/image/upload/v1775412787/facebook-brands-solid_d2bf0z.png"
           width="26" height="26" alt="Facebook">
    </a>

    <a href="https://instagram.com" target="_blank" style="margin:0 6px;">
      <img src="https://res.cloudinary.com/dbmb50bso/image/upload/v1775412787/instagram-brands-solid_cfl1ls.png"
           width="26" height="26" alt="Instagram">
    </a>

  </div>

    <div class="copyright">
      © 2026 PeakWell · All rights reserved.
    </div>

  </div>

</div>

</body>
</html>
