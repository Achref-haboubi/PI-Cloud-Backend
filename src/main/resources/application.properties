spring.application.name=peakWell
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/peakwell?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server configuration :
server.port=8090
server.servlet.context-path=/peakwell

# Multipart file upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Static resource configuration for serving uploaded files
spring.web.resources.static-locations=classpath:/static/,file:uploads/